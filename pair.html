<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DELTA PAIRING CODE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #80d0ff;
    }

    .card {
      background: rgba(30, 60, 90, 0.85);
      padding: 30px 20px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1s ease-in-out;
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 22px;
      color: #ff4081;
    }

    .card p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #00ffff;
    }

    .input-box {
      display: flex;
      margin-bottom: 15px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .input-box input {
      padding: 12px;
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }

    .input-box button {
      background: #6c5ce7;
      border: none;
      color: white;
      padding: 0 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-box button:hover {
      background: #a29bfe;
    }

    #pair {
      margin-top: 20px;
      font-weight: bold;
    }

    #copy {
      cursor: pointer;
      transition: 0.3s;
    }

    #copy:hover {
      color: #00cec9;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 400px) {
      .card {
        width: 90%;
      }

      .input-box {
        flex-direction: column;
      }

      .input-box button {
        width: 100%;
        border-radius: 0 0 12px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>DELTA BOT</h2>
    <p>Enter your WhatsApp number with country code (e.g. 54896xxx)</p>
    <div class="input-box">
      <input type="number" id="number" placeholder="54896xxx" />
      <button id="submit">Submit</button>
    </div>
    <div id="pair"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "COPIED!";
      setTimeout(() => {
        obj.innerText = text;
      }, 1000);
    }

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerHTML = `<p style="color: #ff7675">Enter your number with country code.</p>`;
      } else if (c.value.replace(/[^0-9]/g, "").length < 10) {
        a.innerHTML = `<p style="color: #fab1a0">Invalid Number</p>`;
      } else {
        const Wasi_Tech = c.value.replace(/[^0-9]/g, "");
        const cleaned = Wasi_Tech.replace(/\D/g, "");
c.type = "text";
c.value = "+" + cleaned;
        c.style.color = "#333";
        a.innerHTML = '<p>Please Wait...</p>';

        try {
          let { data } = await axios(`/code?number=${Wasi_Tech}`);
          let code = data.code || "Service Unavailable";
          a.innerHTML = `<p id="copy" onclick="Copy()">CODE: <span style="color: #81ecec">${code}</span></p>`;
        } catch (err) {
          a.innerHTML = `<p style="color: #d63031">Error fetching code.</p>`;
        }
      }
    });
  </script>
</body>
</html>
